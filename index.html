<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1115" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Finanzen" />
    <title>Finanzen – Einnahmen &amp; Ausgaben</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="app-icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__row">
        <h1 class="topbar__title">Finanzen</h1>
        <div class="controls">
          <div class="segmented" id="scope-switch" role="group" aria-label="Bereich">
            <button type="button" class="segmented__btn is-active" data-scope="ich">Nur ich</button>
            <button type="button" class="segmented__btn" data-scope="partner">Partner</button>
            <button type="button" class="segmented__btn" data-scope="haushalt">Haushalt</button>
          </div>
          <div class="segmented" id="period-switch" role="group" aria-label="Zeitraum">
            <button type="button" class="segmented__btn is-active" data-period="month">Monat</button>
            <button type="button" class="segmented__btn" data-period="year">Jahr</button>
          </div>
        </div>
        <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Menü öffnen" aria-expanded="false" title="Menü">☰</button>
      </div>
      <nav class="tabs" id="tabs" aria-label="Ansichten">
        <button type="button" class="tab is-active" data-tab="overview">Überblick</button>
        <button type="button" class="tab" data-tab="budget">Budget</button>
        <button type="button" class="tab" data-tab="assets">Vermögen</button>
      </nav>
    </header>

    <aside class="app-menu" id="app-menu" hidden aria-label="App-Menü">
      <button type="button" data-menu-action="settings">Einstellungen</button>
      <button type="button" data-menu-action="quick-add">Hinzufügen</button>
      <button type="button" data-menu-action="save">Jetzt speichern</button>
      <button type="button" data-menu-action="demo">Demo-Modus aktivieren</button>
    </aside>

    <main class="view" id="view"></main>

    <input type="file" id="import-file" accept="application/json" hidden />

    <dialog class="quick-entry" id="quick-entry-dialog" aria-labelledby="quick-entry-title">
      <form method="dialog" id="quick-entry-form">
        <header class="quick-entry__head">
          <h2 id="quick-entry-title">Schnell erfassen</h2>
          <button type="button" class="icon-btn" id="quick-entry-close" aria-label="Erfassung schließen" title="Schließen">×</button>
        </header>
        <div class="quick-entry__fields">
          <label class="field"><span>Art</span>
            <select class="input" id="quick-entry-type">
              <option value="variabel">Ausgabe</option>
              <option value="einnahme">Einnahme</option>
              <option value="sparen">Sparen</option>
            </select>
          </label>
          <label class="field"><span>Gruppe</span>
            <select class="input" id="quick-entry-group"></select>
          </label>
          <label class="field quick-entry__wide"><span>Bezeichnung</span>
            <input class="input" id="quick-entry-name" required autocomplete="off" placeholder="z. B. Supermarkt" />
          </label>
          <label class="field"><span>Betrag pro Monat</span>
            <input class="input" id="quick-entry-amount" required inputmode="decimal" placeholder="0,00" />
          </label>
        </div>
        <p class="hint" id="quick-entry-hint"></p>
        <footer class="quick-entry__actions">
          <button type="button" class="btn btn--ghost" id="quick-entry-cancel">Abbrechen</button>
          <button type="submit" class="btn">Eintrag hinzufügen</button>
        </footer>
      </form>
    </dialog>

    <script src="seed.js"></script>
    <script src="store.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        navigator.serviceWorker.register("service-worker.js");
      }
    </script>
  </body>
</html>
